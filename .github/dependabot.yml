version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '08:12'
      timezone: Asia/Taipei
    # Wait 7 days after a release before proposing it (supply-chain safety).
    cooldown:
      default-days: 7
    # Only group first-party actions; third-party actions (dawidd6/*) get their own PRs.
    groups:
      actions:
        patterns: ['actions/*']
