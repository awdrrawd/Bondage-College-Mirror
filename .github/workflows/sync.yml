name: Sync code mirrors

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync.yml"
  schedule:
    # 每3小時檢查一次上游是否有新 commit(GitHub Actions 使用 UTC)。
    # 檢查本身只用 git ls-remote,幾乎零成本;只有偵測到上游有更新時才會真正 clone。
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: code-mirrors
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out mirror configuration
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize filtered snapshot branches
        shell: bash
        run: |
          set -euo pipefail

          # Avoid upstream HTTP/2 stream resets, including partial-clone fetches.
          git config --global http.version HTTP/1.1

          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              if [[ "$attempt" -lt 3 ]]; then
                echo "Retry $attempt/3 after network command failed" >&2
                sleep "$((attempt * 5))"
              fi
            done
            return 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 用來記錄本次執行後,每個 target branch 對應的最新上游 commit hash。
          # 執行完所有 mirror 後會一次寫回 sync-state 分支。
          declare -A NEW_STATE=()

          STATE_BRANCH="sync-state"

          # 透過 raw.githubusercontent.com 讀取上次記錄的 commit hash。
          # 只是一次輕量 HTTP GET,不需要 clone/fetch,state 分支不存在或檔案不存在時回傳空字串。
          get_last_commit() {
            local key="$1"
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${STATE_BRANCH}/${key}.commit" 2>/dev/null || true
          }

          sync_mirror() {
            local source_url="$1"
            local source_ref="$2"
            local source_path="$3"
            local target_branch="$4"
            local clone_mode="$5"
            local temp_dir
            local upstream
            local pathspec_file
            local source_root
            local upstream_commit
            local latest_commit
            local last_commit

            echo "::group::Check $target_branch"
            # 先用 ls-remote 問上游目前的 commit,不下載任何內容,成本極低。
            latest_commit="$(retry git ls-remote "$source_url" "refs/heads/$source_ref" | cut -f1)"

            if [[ -z "$latest_commit" ]]; then
              echo "::warning::Could not determine latest commit for $target_branch via ls-remote, will sync anyway"
            else
              last_commit="$(get_last_commit "$target_branch")"
              if [[ -n "$last_commit" && "$latest_commit" == "$last_commit" ]]; then
                echo "No upstream changes for $target_branch ($latest_commit), skip download"
                echo "::endgroup::"
                return
              fi
              echo "Upstream changed (or first run) for $target_branch: $latest_commit"
            fi
            echo "::endgroup::"

            temp_dir="$(mktemp -d "$RUNNER_TEMP/mirror.XXXXXX")"
            upstream="$temp_dir/upstream"
            pathspec_file="$temp_dir/selected-paths.bin"

            echo "::group::Fetch $target_branch"
            if [[ "$clone_mode" == "partial" ]]; then
              git clone \
                --depth=1 \
                --filter=blob:none \
                --no-checkout \
                --branch="$source_ref" \
                "$source_url" \
                "$upstream"
            else
              git clone \
                --depth=1 \
                --recurse-submodules \
                --shallow-submodules \
                --branch="$source_ref" \
                "$source_url" \
                "$upstream"
            fi

            upstream_commit="$(git -C "$upstream" rev-parse HEAD)"

            if [[ "$clone_mode" == "partial" ]]; then
              SOURCE_PATH="$source_path" \
              UPSTREAM="$upstream" \
              PATHSPEC_FILE="$pathspec_file" \
              python3 <<'PY'
          import os
          import subprocess
          from pathlib import Path

          media_extensions = {
              # Images and image project files
              ".ai", ".avif", ".bmp", ".eps", ".gif", ".ico", ".jpe",
              ".jpeg", ".jpg", ".jxl", ".kra", ".pdn", ".png", ".psb",
              ".psd", ".svg", ".tga", ".tif", ".tiff", ".webp", ".xcf",
              # Audio
              ".aac", ".flac", ".m4a", ".mid", ".midi", ".mp3", ".oga",
              ".ogg", ".opus", ".wav",
              # Video
              ".avi", ".m4v", ".mkv", ".mov", ".mp4", ".mpeg", ".mpg",
              ".ogv", ".webm", ".wmv",
              # Fonts, 3D assets, documents, and archives
              ".7z", ".blend", ".eot", ".fbx", ".glb", ".gltf", ".gz",
              ".obj", ".otf", ".pdf", ".rar", ".tar", ".ttf", ".woff",
              ".woff2", ".zip",
          }

          def is_media(path: str) -> bool:
              # Also recognize editor backup names such as image.png~.
              normalized = path.lower().rstrip("~")
              return Path(normalized).suffix in media_extensions

          upstream = os.environ["UPSTREAM"]
          source_path = os.environ["SOURCE_PATH"]
          command = [
              "git", "-C", upstream, "ls-tree", "-r", "-z", "--name-only",
              "HEAD",
          ]
          if source_path != ".":
              command.append(source_path.rstrip("/") + "/")

          result = subprocess.run(command, check=True, stdout=subprocess.PIPE)
          selected = [
              raw_path
              for raw_path in result.stdout.split(b"\0")
              if raw_path
              and not is_media(
                  raw_path.decode("utf-8", errors="surrogateescape")
              )
          ]

          with open(os.environ["PATHSPEC_FILE"], "wb") as output:
              for path in selected:
                  output.write(path + b"\0")

          print(f"Selected {len(selected)} non-media paths")
          PY

              if [[ -s "$pathspec_file" ]]; then
                git -C "$upstream" checkout HEAD \
                  --pathspec-from-file="$pathspec_file" \
                  --pathspec-file-nul
              fi

              # Include submodule source in downloadable ZIP snapshots.
              if [[ -f "$upstream/.gitmodules" ]]; then
                git -C "$upstream" submodule update \
                  --init --recursive --depth=1 --filter=blob:none
              fi
            fi

            if [[ "$source_path" == "." ]]; then
              source_root="$upstream"
            else
              source_root="$upstream/$source_path"
            fi

            # Submodules are checked out separately, so filter their files too.
            SOURCE_ROOT="$source_root" python3 <<'PY'
          import os
          from pathlib import Path

          media_extensions = {
              ".7z", ".aac", ".ai", ".avi", ".avif", ".blend", ".bmp",
              ".eot", ".eps", ".fbx", ".flac", ".gif", ".glb", ".gltf",
              ".gz", ".ico", ".jpe", ".jpeg", ".jpg", ".jxl", ".kra",
              ".m4a", ".m4v", ".mid", ".midi", ".mkv", ".mov", ".mp3",
              ".mp4", ".mpeg", ".mpg", ".obj", ".oga", ".ogg", ".ogv",
              ".opus", ".otf", ".pdf", ".pdn", ".png", ".psb", ".psd",
              ".rar", ".svg", ".tar", ".tga", ".tif", ".tiff", ".ttf",
              ".wav", ".webm", ".webp", ".wmv", ".woff", ".woff2", ".xcf",
              ".zip",
          }

          root = Path(os.environ["SOURCE_ROOT"])
          for path in root.rglob("*"):
              if path.is_file() and path.name != ".git":
                  normalized = path.name.lower().rstrip("~")
                  if Path(normalized).suffix in media_extensions:
                      path.unlink()
          PY
            echo "::endgroup::"

            echo "::group::Update $target_branch"
            git fetch origin \
              "+refs/heads/$target_branch:refs/remotes/origin/$target_branch" \
              2>/dev/null || true

            if git show-ref --verify --quiet "refs/remotes/origin/$target_branch"; then
              git checkout -B "$target_branch" "origin/$target_branch"
            else
              git checkout --orphan "$target_branch"
              git rm -rf .
            fi

            rsync -a --delete \
              --exclude='.git' \
              --exclude='.github/workflows/' \
              "$source_root/" \
              ./
            git add --all --force

            if git diff --cached --quiet; then
              echo "No changes for $target_branch"
            else
              git commit -m "Sync from upstream ${upstream_commit:0:12}"
              git push origin "HEAD:$target_branch"
            fi

            git checkout --force main
            rm -rf "$temp_dir"
            echo "::endgroup::"

            # 記錄本次的上游 commit,稍後統一寫回 sync-state 分支,
            # 這樣即使過濾後內容沒變,下次也能直接靠 ls-remote 判斷跳過。
            if [[ -n "$latest_commit" ]]; then
              NEW_STATE["$target_branch"]="$upstream_commit"
            fi
          }

          update_state_branch() {
            if [[ ${#NEW_STATE[@]} -eq 0 ]]; then
              echo "No state updates needed"
              return
            fi

            echo "::group::Update $STATE_BRANCH"
            git fetch origin \
              "+refs/heads/$STATE_BRANCH:refs/remotes/origin/$STATE_BRANCH" \
              2>/dev/null || true

            if git show-ref --verify --quiet "refs/remotes/origin/$STATE_BRANCH"; then
              git checkout -B "$STATE_BRANCH" "origin/$STATE_BRANCH"
            else
              git checkout --orphan "$STATE_BRANCH"
              git rm -rf . 2>/dev/null || true
            fi

            for branch in "${!NEW_STATE[@]}"; do
              echo "${NEW_STATE[$branch]}" > "${branch}.commit"
            done

            git add --all
            if git diff --cached --quiet; then
              echo "State unchanged"
            else
              git commit -m "Update sync state"
              git push origin "HEAD:$STATE_BRANCH"
            fi

            git checkout --force main
            echo "::endgroup::"
          }

          # A fresh Bash process preserves errexit inside sync_mirror. Calling the
          # function directly in an `if` would disable errexit in its whole body.
          export -f retry get_last_commit sync_mirror update_state_branch
          export STATE_BRANCH
          failed_mirrors=()
          run_mirror() {
            if bash -euo pipefail -c '
              declare -A NEW_STATE=()
              sync_mirror "$@"
              update_state_branch
            ' mirror "$@"; then
              echo "- $4: success" >> "$GITHUB_STEP_SUMMARY"
            else
              failed_mirrors+=("$4")
              echo "::endgroup::"
              echo "::error::Mirror $4 failed; continuing with the other mirrors"
              echo "- $4: FAILED (see logs)" >> "$GITHUB_STEP_SUMMARY"
              # Restore the disposable Actions checkout before the next mirror.
              git checkout --force main
            fi
          }

          # Each snapshot is stored at the root of its own branch for clean ZIPs.
          run_mirror \
            "https://github.com/SugarChain-Studio/echo-activity-ext.git" \
            "main" \
            "." \
            "echo-activity-ext" \
            "shallow"

          run_mirror \
            "https://github.com/SugarChain-Studio/echo-clothing-ext.git" \
            "main" \
            "." \
            "echo-clothing-ext" \
            "shallow"

          run_mirror \
            "https://gitgud.io/BondageProjects/Bondage-College.git" \
            "master" \
            "BondageClub" \
            "bondageclub" \
            "partial"

          # Mod source snapshots for translation maintenance (upstream default branches).
          run_mirror \
            "https://github.com/Jomshir98/bondage-club-extended.git" \
            "master" \
            "." \
            "bcx" \
            "shallow"

          run_mirror \
            "https://github.com/littlesera/LSCG.git" \
            "main" \
            "." \
            "lscg" \
            "shallow"

          run_mirror \
            "https://github.com/Seles84/bc-plus.git" \
            "main" \
            "." \
            "bcplus" \
            "shallow"

          if [[ ${#failed_mirrors[@]} -gt 0 ]]; then
            echo "::error::Failed mirrors: ${failed_mirrors[*]}"
            exit 1
          fi
      - name: Check notification configuration
        if: failure()
        id: mail
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ vars.MAIL_TO }}
        run: |
          if [[ -n "$MAIL_USERNAME" && -n "$MAIL_PASSWORD" && -n "$MAIL_TO" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Email notification skipped: configure MAIL_USERNAME, MAIL_PASSWORD secrets and MAIL_TO variable." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Notify on failure
        if: failure() && steps.mail.outputs.enabled == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "鏡像同步失敗"
          to: ${{ vars.MAIL_TO }}
          from: GitHub Actions
          body: "Bondage-College-Mirror 同步失敗,請檢查 workflow log。"
