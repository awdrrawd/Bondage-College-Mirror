name: Reusable BC compatibility

# 共用的 BC 相容性檢查，由 AEE、FCM、LCE、Responsive、BCTP 的 bc-compat.yml 以 workflow_call 呼叫。
# 流程：抓本鏡像的 BC 程式碼 → 執行呼叫端的檢查腳本（--bc-dir … --json --report …）→ 把結果交給呼叫端的 issue 腳本，
# 有差異時開／更新一則 issue，恢復一致後自動關閉。只有檢查本身出錯（結束碼 ≥ 2）才讓工作失敗；不會擋 PR 或部署。
# 呼叫端的 job 需給 permissions: contents: read、issues: write。修改這裡會影響所有呼叫端。
on:
  workflow_call:
    inputs:
      module:
        description: 顯示在 issue 中的模組名稱（例如 AEE、FCM）
        required: true
        type: string
      bc-repo-url:
        description: BC 原始碼的 git 網址（空白 = 本鏡像）
        required: false
        type: string
        default: ''
      bc-ref:
        description: BC 分支或 tag（空白 = bondageclub）
        required: false
        type: string
        default: ''
      node-version:
        required: false
        type: string
        default: '22'
      check-script:
        required: false
        type: string
        default: scripts/check-bc-compat.mjs
      issue-script:
        required: false
        type: string
        default: scripts/bc-compat-issue.mjs

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Compare hooks with the BC mirror
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BC_REPO_URL: ${{ inputs.bc-repo-url || 'https://github.com/awdrrawd/Bondage-College-Mirror.git' }}
      BC_REF: ${{ inputs.bc-ref || 'bondageclub' }}
      MODULE: ${{ inputs.module }}
      CHECK_SCRIPT: ${{ inputs.check-script }}
      ISSUE_SCRIPT: ${{ inputs.issue-script }}
    steps:
      # 在 reusable workflow 內，checkout 取得的是呼叫端的 repo。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fetch the Bondage Club code mirror
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch "$BC_REF" "$BC_REPO_URL" "$RUNNER_TEMP/bc"
          git -C "$RUNNER_TEMP/bc" sparse-checkout set --no-cone '/Scripts/' '/Screens/**/*.js'
      - name: Compare hooked functions with the baseline
        id: compare
        run: |
          set +e
          node "$CHECK_SCRIPT" --bc-dir "$RUNNER_TEMP/bc" --json --report "$RUNNER_TEMP/report.md" > "$RUNNER_TEMP/report.json"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/report.md" ]; then cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"; fi
          # 0 = 一致、1 = 有差異（下一步回報）；其他代碼代表檢查本身壞了，讓 job 失敗。
          if [ "$code" -gt 1 ]; then exit "$code"; fi
      - name: Sync the tracking issue (update on change, close when resolved)
        if: steps.compare.outputs.code == '0' || steps.compare.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node "$ISSUE_SCRIPT" "$MODULE" "$RUNNER_TEMP/report.json" "$RUNNER_TEMP/report.md"
